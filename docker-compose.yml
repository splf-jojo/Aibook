services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aibook
      POSTGRES_USER: aibook
      POSTGRES_PASSWORD: aibook
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibook -d aibook"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
