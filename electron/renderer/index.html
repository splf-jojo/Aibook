<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="auth" class="auth">
      <form id="login-form" class="login-form">
        <input id="username" aria-label="Логин" autocomplete="username" placeholder="Логин" required minlength="3" />
        <input id="password" aria-label="Пароль" autocomplete="current-password" placeholder="Пароль" type="password" required minlength="8" />
        <button aria-label="Войти" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" /></svg>
        </button>
      </form>
    </main>

    <main id="workspace" class="workspace" hidden>
      <aside id="thumbnails" class="thumbnails"></aside>
      <section class="viewer">
        <img id="preview" alt="" hidden />
        <div class="actions">
          <button id="metadata-button" class="icon-button" aria-label="Метаданные" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7h.01" /></svg>
          </button>
          <button id="logout-button" class="icon-button" aria-label="Выйти">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
          </button>
        </div>
      </section>
    </main>

    <dialog id="metadata-dialog">
      <button id="metadata-close" class="dialog-close" aria-label="Закрыть">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
      <dl id="metadata-list"></dl>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
